<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Teamsters Local 2024 Calendar</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
    }

    .calendar-frame {
      width: 100%;
      border: 0;
      display: block;
    }

    .fade-up {
      animation: fadeUp 0.6s ease-out both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-[#f5f7fb] text-slate-900">

  <!-- HEADER -->
  <header class="bg-[#071d49] text-white">
    <div class="max-w-7xl mx-auto px-5 sm:px-8 py-7">

      <div class="flex items-center justify-between gap-5">

        <div>
          <p class="text-blue-200 text-xs sm:text-sm font-bold uppercase tracking-[0.2em] mb-1">
            Events & Calendar
          </p>

          <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight">
            Teamsters Local 2024
          </h1>
        </div>

        <button
          onclick="window.location.href='mailto:NFN@JC43.org?subject=Volunteer Inquiry&body=Hello,%20I%20am%20interested%20in%20volunteering%20with%20Teamsters%20Local%202024.%20Here%20is%20some%20information%20about%20me:%0A%0AName:%20%0ACampus:%20%0APhone%20Number:%20%0A%0AThank%20you!'"
          class="
            shrink-0
            inline-flex items-center gap-2
            bg-white
            text-[#071d49]
            px-4 sm:px-6
            py-3
            rounded-full
            font-bold
            text-sm
            shadow-sm
            hover:bg-blue-50
            hover:-translate-y-0.5
            active:translate-y-0
            transition
          "
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="w-4 h-4"
          >
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 5v14M5 12h14" />
          </svg>

<span>Table With Us</span>
        </button>

      </div>
    </div>
  </header>


  <!-- INTRO -->
  <div class="max-w-7xl mx-auto px-5 sm:px-8 pt-10 pb-3 fade-up">

    <div class="max-w-2xl">
      <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
        Stay connected.
      </h2>

      <p class="mt-3 text-slate-500 text-base sm:text-lg leading-relaxed">
        Find upcoming Local 2024 meetings, events, trainings, and important dates.
      </p>
    </div>

  </div>


  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-5 sm:px-8 py-7 space-y-8">


    <!-- UPCOMING EVENTS -->
    <section
      class="
        bg-white
        border border-slate-200/80
        rounded-[24px]
        shadow-[0_8px_30px_rgba(15,23,42,0.06)]
        overflow-hidden
        fade-up
      "
    >

      <div
        class="
          px-5 sm:px-7
          py-5
          border-b border-slate-100
          flex items-center gap-4
        "
      >

        <div
          class="
            w-11 h-11
            rounded-xl
            bg-blue-50
            text-blue-700
            flex items-center justify-center
            shrink-0
          "
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="w-5 h-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
          </svg>
        </div>

        <div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-900">
            Upcoming Events
          </h2>

          <p class="text-sm text-slate-500 mt-0.5">
            What's coming up next
          </p>
        </div>

      </div>


      <div class="p-3 sm:p-5 bg-slate-50/60">

        <div
          class="
            bg-white
            rounded-[18px]
            border border-slate-200
            overflow-hidden
          "
        >

          <iframe
            src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FDetroit&showPrint=0&title=Teamsters%20Local%202024&mode=AGENDA&showCalendars=0&src=OTMxNWE2ZDI0ZGRkOGM2NThkMTU3YTFhYjU0YTM3ZTIwOWQ5MjdjNjcwMjc3NDU3NDliODI4NDI0NTJmOTYyNkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23D81B60"
            class="calendar-frame h-[480px] sm:h-[520px]"
            title="Upcoming Teamsters Local 2024 events"
            loading="lazy"
          ></iframe>

        </div>

      </div>

    </section>


    <!-- FULL CALENDAR -->
    <section
      class="
        bg-white
        border border-slate-200/80
        rounded-[24px]
        shadow-[0_8px_30px_rgba(15,23,42,0.06)]
        overflow-hidden
        fade-up
      "
    >

      <div
        class="
          px-5 sm:px-7
          py-5
          border-b border-slate-100
          flex items-center gap-4
        "
      >

        <div
          class="
            w-11 h-11
            rounded-xl
            bg-blue-50
            text-blue-700
            flex items-center justify-center
            shrink-0
          "
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="w-5 h-5"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path stroke-linecap="round" d="M16 2v4M8 2v4M3 10h18"></path>
            <path stroke-linecap="round" d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"></path>
          </svg>
        </div>

        <div>
          <h2 class="text-lg sm:text-xl font-bold text-slate-900">
            Full Calendar
          </h2>

          <p class="text-sm text-slate-500 mt-0.5">
            Browse all scheduled events
          </p>
        </div>

      </div>


      <div class="p-3 sm:p-5 bg-slate-50/60">

        <div
          class="
            bg-white
            rounded-[18px]
            border border-slate-200
            overflow-hidden
          "
        >

          <iframe
            src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FDetroit&showPrint=0&title=Teamsters%20Local%202024&mode=MONTH&showCalendars=0&src=OTMxNWE2ZDI0ZGRkOGM2NThkMTU3YTFhYjU0YTM3ZTIwOWQ5MjdjNjcwMjc3NDU3NDliODI4NDI0NTJmOTYyNkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%23D81B60"
            class="calendar-frame h-[520px] sm:h-[650px]"
            title="Teamsters Local 2024 full calendar"
            loading="lazy"
          ></iframe>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="mt-12 bg-white border-t border-slate-200">

    <div
      class="
        max-w-7xl mx-auto
        px-5 sm:px-8
        py-8
        flex flex-col sm:flex-row
        items-center justify-between
        gap-5
      "
    >

      <div class="text-center sm:text-left">

        <p class="font-bold text-[#071d49]">
          Teamsters Local 2024
        </p>

        <p class="text-sm text-slate-400 mt-1">
          © <span id="year"></span> All rights reserved.
        </p>

      </div>


      <a
        href="https://www.facebook.com/share/g/1AxqftZkxu/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Teamsters Local 2024 Facebook group"
        class="
          w-11 h-11
          rounded-full
          bg-[#071d49]
          text-white
          flex items-center justify-center
          hover:bg-blue-800
          hover:-translate-y-0.5
          transition
        "
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M22.675 0h-21.35C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.127V8.413c0-3.1 1.894-4.788 4.658-4.788 1.325 0 2.463.099 2.793.143v3.236h-1.916c-1.504 0-1.796.715-1.796 1.763v2.31h3.59l-.467 3.622h-3.123V24h6.116c.729 0 1.324-.593 1.324-1.324V1.325C24 .593 23.407 0 22.675 0z"
          />
        </svg>

      </a>

    </div>

  </footer>


  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
